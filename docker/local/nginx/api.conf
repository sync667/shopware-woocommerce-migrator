server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.php;

    charset utf-8;

    # Security headers for API
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # CORS headers (adjust origins as needed)
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
    add_header Access-Control-Max-Age 3600 always;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression for API responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json application/javascript text/plain text/css text/xml application/xml;

    # Handle preflight OPTIONS requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # All requests routed to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Disable unnecessary file requests
    location = /favicon.ico { access_log off; log_not_found off; return 404; }
    location = /robots.txt  { access_log off; log_not_found off; return 404; }

    error_page 404 /index.php;

    # PHP-FPM configuration
    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Timeouts: large Shopware dump imports stream multi-GB uploads through
        # FastCGI before PHP responds, so 5 minutes is far too short.
        fastcgi_read_timeout 3600;
        fastcgi_send_timeout 3600;
        fastcgi_connect_timeout 60;

        # Buffer settings optimized for API responses
        fastcgi_buffer_size 32k;
        fastcgi_buffers 64 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
    }

    # Block access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Deny access to sensitive files
    location ~ /\.(env|git|svn) {
        deny all;
        return 404;
    }

    # Max request body size (for file uploads via API). Shopware production
    # dumps frequently run multi-GB; PHP has matching `post_max_size = 10G`.
    client_max_body_size 10G;

    # Don't buffer the entire upload to disk before passing to FastCGI —
    # stream chunks straight to PHP so multi-GB uploads don't double-write
    # to the nginx temp dir first.
    client_body_buffer_size 1m;
    proxy_request_buffering off;
}
